# ============================================================================
# Render Blueprint Specification
# E-Commerce Management System - DBMS Case Study (Vedant V Chaudhari)
# ============================================================================
services:
  # Web Application Service
  - type: web
    name: vedant-ecommerce-dbms
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_VERSION
        value: 20.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: vedant-ecommerce-db
          property: connectionString

# Cloud Managed PostgreSQL Database
databases:
  - name: vedant-ecommerce-db
    databaseName: vedantchaudhari_ecommerce
    user: vedant
    plan: free

